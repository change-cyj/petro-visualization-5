<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示范：注水泥参数智能优化</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 1100px; margin: 0 auto; padding: 24px 20px; color: #242b2e; background: #fdfcf9; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lead { color: #5d666d; font-size: 13px; margin: 0 0 20px; line-height: 1.6; }
  .ctl { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px; }
  .ctl label { min-width: 130px; color: #5d666d; }
  .ctl input[type=range] { flex: 1; max-width: 220px; }
  .ctl .val { min-width: 54px; text-align: right; font-family: monospace; color: #2f7d6b; font-weight: 600; }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; margin-top: 14px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: #fdfcf9; border: 1px solid #e9e4d8; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .panel h3 { margin: 0 0 8px; font-size: 12px; color: #79828a; text-transform: uppercase; letter-spacing: 1px; }
  .metric-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed #eeeae0; }
  .metric-row:last-child { border-bottom: none; }
  .metric-row .k { color: #5d666d; }
  .metric-row .v { font-family: monospace; font-weight: 600; }
  .result { padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; margin-top: 10px; }
  .result.ok { background: #e6f1ec; color: #2f7d6b; }
  .result.warn { background: #f8ecdf; color: #b26a39; }
  .result.bad { background: #f9e9e5; color: #b05a51; }
  .pareto-pt { cursor: pointer; }
  .pareto-pt circle { transition: r 0.15s; }
  .pareto-pt:hover circle { r: 6; }
</style>
</head>
<body>

<h1>注水泥参数智能优化示范</h1>
<p class="lead">给定一口井的密度窗口（孔隙压力 ~ 破裂压力），拖动滑杆改变设计参数，实时计算各深度段的当量密度、漏失风险和顶替效率。右侧 Pareto 前沿展示了全部候选方案中"效率 vs 安全"的 trade-off。</p>

<div class="ctl">
  <label>孔隙压力梯度</label>
  <input type="range" id="pp" min="0.8" max="1.3" step="0.01" value="1.02">
  <span class="val" id="pp-v">1.02</span> <span style="color:#9ba3a9;font-size:11px">g/cm³</span>
</div>
<div class="ctl">
  <label>破裂压力梯度</label>
  <input type="range" id="fp" min="1.0" max="1.5" step="0.01" value="1.15">
  <span class="val" id="fp-v">1.15</span> <span style="color:#9ba3a9;font-size:11px">g/cm³</span>
</div>
<div class="ctl">
  <label>水泥浆密度</label>
  <input type="range" id="cd" min="0.9" max="1.6" step="0.01" value="1.10">
  <span class="val" id="cd-v">1.10</span> <span style="color:#9ba3a9;font-size:11px">g/cm³</span>
</div>
<div class="ctl">
  <label>排量</label>
  <input type="range" id="rate" min="10" max="50" step="1" value="25">
  <span class="val" id="rate-v">25</span> <span style="color:#9ba3a9;font-size:11px">L/s</span>
</div>

<div class="layout">
  <div>
    <svg id="profile" viewBox="0 0 560 340" style="width:100%;max-width:560px" role="img"></svg>
    <div style="margin-top:14px">
      <span style="font-size:11px;color:#79828a">↑ 密度窗口 = 破裂压力 − 孔隙压力 = </span>
      <b style="font-family:monospace" id="window-val"></b>
      <span style="font-size:11px;color:#79828a"> g/cm³</span>
    </div>
  </div>
  <div class="side">
    <div class="panel">
      <h3>Pareto 前沿</h3>
      <svg id="pareto" viewBox="0 0 280 200" style="width:100%;max-width:280px"></svg>
      <div style="font-size:11px;color:#79828a;margin-top:4px">横轴：漏失概率 ↓  纵轴：顶替效率 ↑</div>
    </div>
    <div class="panel">
      <h3>当前方案评估</h3>
      <div class="metric-row"><span class="k">漏失概率</span><span class="v" id="loss-p">—</span></div>
      <div class="metric-row"><span class="k">顶替效率</span><span class="v" id="disp-e">—</span></div>
      <div class="metric-row"><span class="k">窗口裕度</span><span class="v" id="margin">—</span></div>
      <div id="result" class="result"></div>
    </div>
  </div>
</div>

<script src="demo.js"></script>
<script>if (window.C2CemDesignDemo) C2CemDesignDemo(document.body);</script>

</body>
</html>
